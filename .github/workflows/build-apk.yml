name: Build Android APK (Local en GitHub - Sin Cola)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Preview APK Local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Android APK (Local en Runner de GitHub)
        run: eas build --platform android --profile preview --local --output ./cuentapp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CuentApp-APK
          path: ./cuentapp.apk
          if-no-files-found: error
